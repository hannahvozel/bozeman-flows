name: Refresh flows & send alerts

on:
  schedule:
    - cron: "29 */3 * * *"   # every 3 hours at 29 min
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print alert emails instead of sending them"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: flows
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch USGS flows, write snapshot, evaluate alerts
        env:
          USGS_API_KEY: ${{ secrets.USGS_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m riverwatch --dry-run
          else
            python -m riverwatch
          fi

      - name: Commit snapshot and alert state
        run: |
          git config user.name "flow-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update flows $(date -u +'%Y-%m-%d %H:%M') UTC [skip ci]"
            git push
          fi
